<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Yu Qiao — Science, Code, Discovery</title>
<desc id="desc">Cancer, inflammatory respiratory diseases, macrophages and neutrophils, bioinformatics and AI4Drug. Shanghai Jiao Tong University.</desc>
